name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n codex-fix.sh
      - name: Offline regression tests
        run: python3 -m unittest discover -s tests -v
      - name: ShellCheck
        run: shellcheck codex-fix.sh
